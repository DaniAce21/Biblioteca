{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define el título que aparecerá en la pestaña del navegador. -->
    <title>Página no encontrada · Sistema de Biblioteca</title>

    <!-- Carga Bootstrap para mantener compatibilidad con el resto del sistema. -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Carga Bootstrap Icons para utilizar el icono de error. -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Carga exclusivamente los estilos de la página 404. -->
    <link
        rel="stylesheet"
        href="{% static 'biblioteca_app/css/biblioteca-app-error-404.css' %}"
    >
</head>
<body>
    <!-- ============================================================
         CONTENEDOR PRINCIPAL DE LA PÁGINA 404
         Esta estructura se mantiene independiente del layout general
         para evitar mostrar sidebar, perfil o botones adicionales.
         ============================================================ -->
    <main class="error-page">

        <!-- Capa semitransparente para mejorar la lectura sobre la foto. -->
        <div class="error-page-overlay" aria-hidden="true"></div>

        <!-- Contenido central de la página de error. -->
        <section class="error-card" aria-labelledby="error-title">

            <!-- Icono representativo del error. -->
            <div class="error-icon" aria-hidden="true">
                <i class="bi bi-exclamation-triangle"></i>
            </div>

            <!-- Código HTTP mostrado de forma destacada. -->
            <div class="error-code">404</div>

            <!-- Título principal del error. -->
            <h1 id="error-title">Página no encontrada</h1>

            <!-- Mensaje breve para explicar el problema al usuario. -->
            <p>
                La página que intentas abrir no existe o ya no está disponible.
            </p>

            <!-- Única acción disponible, tal como se solicitó. -->
            <a href="{% url 'inicio' %}" class="error-home-button">
                <i class="bi bi-house-fill" aria-hidden="true"></i>
                <span>Volver al inicio</span>
            </a>
        </section>
    </main>
</body>
</html>
