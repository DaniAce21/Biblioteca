{% extends 'biblioteca_app/base.html' %}{% block title %}Eliminar autor · Sistema de Biblioteca{% endblock %}{% block page_heading %}Eliminar autor{% endblock %}{% block content %}<div class="confirm-card"><div class="confirm-icon"><i class="bi bi-trash3"></i></div><h1>Eliminar autor</h1><p>¿Seguro que deseas eliminar <strong>{{ autor.NombreAutor }}</strong>?</p><form method="post">{% csrf_token %}<div class="confirm-actions"><a href="{% url 'autor_list' %}" class="btn-ui btn-dark">Cancelar</a><button class="btn-ui btn-danger-soft" type="submit">Eliminar</button></div></form></div>{% endblock %}
